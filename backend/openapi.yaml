    post:
      tags:
        - ai
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: jobId
          in: path
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  nodes:
                    type: integer
                  relations:
                    type: integer
                required:
                  - ok
                  - nodes
                  - relations
  /api/ai/jobs/{jobId}/approve:
    post:
      tags:
        - ai
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: true
          name: jobId
          in: path
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                node_ids:
                  type: array
                  items:
                    type: string
                  default: []
                relation_ids:
                  type: array
                  items:
                    type: string
                  default: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  nodes:
                    type: integer
                  relations:
                    type: integer
                required:
                  - ok
                  - nodes
                  - relations
