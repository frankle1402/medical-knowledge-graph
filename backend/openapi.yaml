  /api/system/ai-logs:
    get:
      tags:
        - system
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
          required: false
          name: graph_id
          in: query
        - schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          required: false
          name: limit
          in: query
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        graph_id:
                          type:
                            - string
                            - "null"
                        template_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                        user_id:
                          type:
                            - string
                            - "null"
                          format: uuid
                        prompt_used:
                          type:
                            - string
                            - "null"
                        llm_response:
                          type:
                            - string
                            - "null"
                        nodes_created:
                          type: integer
                          default: 0
                        relations_created:
                          type: integer
                          default: 0
                        status:
                          type: string
                        error_msg:
                          type:
                            - string
                            - "null"
                        created_at:
                          type: string
                          format: date-time
                      required:
                        - id
                        - status
                  total:
                    type: integer
                required:
                  - items
                  - total
